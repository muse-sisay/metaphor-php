name: deploy metaphor-php to production
on:
  push:
    branches:
      - main 

jobs:
  build_image:
    name: "Build Image"
    permissions:
      packages: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Login to Container Registry"
        uses: docker/login-action@v3
        with: 
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: ghcr.io/${{ github.repository }}:${{github.sha}}
  
  update_chart:
    name: "Update Chart"
    needs: build_image
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag
        run: |
          echo "update image tag to $IMAGE_TAG"
          sed -i "s/tag.*/tag: $IMAGE_TAG/" charts/metaphor-php/values.yaml
        env:
          IMAGE_TAG: ${{github.sha}}
      
      - name: configure git]
        run: |
          git config --global user.email general@konstruct.io
          git config --global user.name $GIT_USER
        env:
          GIT_USER: ${{ github.actor}}

      - name: push changes
        run: |
          git add charts/metaphor-php/values.yaml
          git commit -m "[skip ci]: update metaphor to $IMAGE_TAG"
          git push origin main 
        env:
          IMAGE_TAG: ${{github.sha}}  

  deploy_new_release:
    name: "Deploy new release to production"
    needs: update_chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: upgrade release (helm)
        run: |
          echo "this steps runs helm upgrade"
